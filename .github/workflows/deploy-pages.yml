name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build-and-predeploy-canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect deployable Node app
        id: app
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json on this ref; deploy is skipped."
          fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.present == 'true'
        run: npm ci

      - name: Unit tests
        if: steps.app.outputs.present == 'true'
        run: npm test

      - name: Typecheck
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.app.outputs.present == 'true'
        run: npm run build

      - name: Install Playwright browsers
        if: steps.app.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Pre-deploy Playwright smoke
        if: steps.app.outputs.present == 'true'
        run: npm run test:e2e --if-present

      - name: Configure Pages
        if: steps.app.outputs.present == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.app.outputs.present == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: deploy-and-scripted-canary
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect deployable Node app
        id: app
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json on this ref; deploy is skipped."
          fi

      - name: Deploy to GitHub Pages
        if: steps.app.outputs.present == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for live canary
        if: steps.app.outputs.present == 'true'
        run: npm ci

      - name: Install Playwright browsers for live canary
        if: steps.app.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Post-deploy scripted canary
        id: scripted_canary
        if: steps.app.outputs.present == 'true'
        env:
          CANARY_URL: ${{ steps.deployment.outputs.page_url }}
          CANARY_SHA: ${{ github.sha }}
        run: npm run canary:deployed --if-present

      - name: Post-deploy Playwright live smoke
        id: live_smoke
        if: steps.app.outputs.present == 'true'
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:e2e:live --if-present

      - name: Optional Hermes webhook notification
        if: steps.app.outputs.present == 'true' && always()
        env:
          HERMES_WEBHOOK_URL: ${{ secrets.HERMES_WEBHOOK_URL }}
          HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_STATUS: ${{ job.status }}
          SCRIPTED_CANARY_STATUS: ${{ steps.scripted_canary.outcome }}
          LIVE_SMOKE_STATUS: ${{ steps.live_smoke.outcome }}
        shell: bash
        run: |
          if [ -z "$HERMES_WEBHOOK_URL" ]; then
            echo "HERMES_WEBHOOK_URL is not set; skipping Hermes webhook notification."
            exit 0
          fi
          payload=$(node - <<'NODE'
          const payload = {
            event: 'github_pages_post_deploy_canary',
            repo: process.env.GITHUB_REPOSITORY,
            status: process.env.DEPLOY_STATUS,
            canaryStatus: process.env.SCRIPTED_CANARY_STATUS || 'unknown',
            liveSmokeStatus: process.env.LIVE_SMOKE_STATUS || 'unknown',
            liveUrl: process.env.DEPLOY_URL,
            sha: process.env.DEPLOY_SHA,
            runId: process.env.DEPLOY_RUN_ID,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.DEPLOY_RUN_ID}`,
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          )
          if [ -n "$HERMES_WEBHOOK_SECRET" ]; then
            signature=$(PAYLOAD="$payload" node - <<'NODE'
            const crypto = require('crypto');
            process.stdout.write('sha256=' + crypto
              .createHmac('sha256', process.env.HERMES_WEBHOOK_SECRET)
              .update(process.env.PAYLOAD)
              .digest('hex'));
            NODE
            )
            curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              -H 'X-GitHub-Event: github_pages_post_deploy_canary' \
              -H "X-Hub-Signature-256: $signature" \
              --data "$payload" \
              "$HERMES_WEBHOOK_URL"
          else
            curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              -H 'X-GitHub-Event: github_pages_post_deploy_canary' \
              --data "$payload" \
              "$HERMES_WEBHOOK_URL"
          fi
